services:
  db:
    image: postgres:16-alpine
    container_name: voting-db
    environment:
      POSTGRES_DB: voting_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d voting_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend/voting
    container_name: voting-backend
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=voting_db
      - DB_USER=user
      - DB_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

  frontend:
    build: ./frontend/voting
    container_name: voting-frontend
    ports:
      - "80:80"
    depends_on:
      - backend